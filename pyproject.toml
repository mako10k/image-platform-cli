[project]
name = "image-platform-cli"
version = "0.1.0"
description = "OAuth CLI for the image platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pillow>=11,<12",
  "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
image = "image_platform_cli.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_platform_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["image_platform_cli"]
